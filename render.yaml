services:
  - type: web
    name: fitsync
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: demo
      - key: FRONTEND_URL
        value: https://fitsync.onrender.com
    disk:
      name: fitsync-data
      mountPath: /app/server/data
      sizeGB: 1
